<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'">
<link rel="stylesheet" href="../common/fonts.css">
<style>
  :root { --ink: #17151F; --berry: #6C86F5; --soft: #5D5873; }
  html, body { margin: 0; background: transparent; overflow: hidden; font-family: 'IBM Plex Sans', 'Segoe UI', sans-serif; }
  .card { margin: 4px; padding: 16px 18px; border-radius: 22px; border: 2.5px solid var(--berry);
    background: linear-gradient(#fff, #EEF0FF); color: var(--ink); box-sizing: border-box; cursor: default; -webkit-app-region: drag; }
  .card.collapsed { cursor: pointer; }
  .head { display: flex; align-items: flex-start; gap: 10px; }
  .icon { width: 18px; height: 18px; margin-top: 4px; flex: none; }
  h1 { font: 700 20px/1.2 Fredoka, 'Segoe UI', sans-serif; margin: 0; flex: 1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .expanded h1 { -webkit-line-clamp: 3; }
  button { -webkit-app-region: no-drag; width: 26px; height: 26px; border-radius: 50%; border: 0; background: var(--berry); color: #fff;
    font: 900 14px/26px 'Segoe UI', sans-serif; cursor: pointer; flex: none; padding: 0; }
  button:hover { filter: brightness(1.1); }
  .preview { margin: 10px 0 0; font-size: 14px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .more { margin-top: 6px; font: 400 11px 'IBM Plex Mono', monospace; color: var(--berry); }
  .body { margin-top: 10px; max-height: calc(75vh - 80px); overflow-y: auto; padding-right: 6px; -webkit-app-region: no-drag; }
  .body p { font-size: 15px; line-height: 1.5; margin: 0 0 12px; }
  .label { font: 400 11px 'IBM Plex Mono', monospace; color: var(--soft); letter-spacing: .06em; margin: 4px 0 6px; }
  .source { display: block; color: var(--berry); font-size: 13px; text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 3px 0; cursor: pointer; }
  .source:hover { text-decoration: underline; }
  .loading { display: flex; gap: 10px; align-items: center; color: var(--soft); font-size: 14px; margin-top: 10px; }
  .spinner { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #c9d2ff; border-top-color: var(--berry); animation: spin .8s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error { margin-top: 10px; font-size: 14px; }
</style>
</head>
<body>
<div class="card" id="card"></div>
<script src="report.js"></script>
</body>
</html>
